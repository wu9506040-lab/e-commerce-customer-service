<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg2001" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="card2001" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="55%" stop-color="#7c5cf6"/>
      <stop offset="100%" stop-color="#b44cf6"/>
    </linearGradient>
    <linearGradient id="sheen2001" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="shadow2001"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg2001)"/>

  <!-- 背景光晕 -->
  <circle cx="470" cy="120" r="150" fill="#4f7cff" opacity="0.12"/>
  <circle cx="110" cy="500" r="130" fill="#b44cf6" opacity="0.10"/>
  <circle cx="300" cy="300" r="220" fill="none" stroke="#7c5cf6" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#7c5cf6" stroke-width="1" opacity="0.08"/>

  <!-- 会员卡主体（透视） -->
  <g filter="url(#shadow2001)" transform="rotate(-8 300 310)">
    <rect x="120" y="210" width="360" height="220" rx="22" fill="url(#card2001)"/>
    <rect x="120" y="210" width="360" height="220" rx="22" fill="url(#sheen2001)"/>
    <!-- 卡面高光线 -->
    <rect x="121.5" y="211.5" width="357" height="217" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- 芯片 -->
    <rect x="155" y="265" width="52" height="40" rx="7" fill="#ffd66b"/>
    <line x1="155" y1="278" x2="207" y2="278" stroke="#c99a2e" stroke-width="1.5"/>
    <line x1="155" y1="291" x2="207" y2="291" stroke="#c99a2e" stroke-width="1.5"/>
    <line x1="172" y1="265" x2="172" y2="305" stroke="#c99a2e" stroke-width="1.5"/>
    <line x1="190" y1="265" x2="190" y2="305" stroke="#c99a2e" stroke-width="1.5"/>

    <!-- 虚拟发货闪电 -->
    <g transform="translate(400 246)">
      <path d="M14 0 L0 26 L11 26 L6 48 L26 18 L14 18 L21 0 Z" fill="#fff" opacity="0.95"/>
    </g>

    <!-- 卡号 -->
    <text x="155" y="368" font-family="Consolas, monospace" font-size="26" letter-spacing="5" fill="#ffffff" opacity="0.92">VIP 2026</text>
    <!-- 持卡人 -->
    <text x="155" y="402" font-family="sans-serif" font-size="15" letter-spacing="3" fill="#ffffff" opacity="0.75">PREMIUM MEMBER · 12 MONTHS</text>
  </g>

  <!-- VIP 字样 -->
  <text x="300" y="140" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="52" fill="#ffffff" opacity="0.95">VIP</text>
  <text x="300" y="172" text-anchor="middle" font-family="sans-serif" font-size="16" letter-spacing="8" fill="#b8a9ff">年度会员 · 数字商品</text>

  <!-- 自动发货标签 -->
  <g transform="translate(300 512)">
    <rect x="-132" y="-20" width="264" height="40" rx="20" fill="#0b1020" stroke="#7c5cf6" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c9baff">⚡ AI 客服自动发货</text>
  </g>
</svg>
